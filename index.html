<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Live Synthist</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#fff;font-family:Arial,sans-serif}
.app{max-width:520px;margin:auto;padding:18px}
h1{margin:4px 0 20px;text-align:center;font-size:28px}
.card{background:#151b23;border:1px solid #293342;border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 14px}
button{border:0;border-radius:10px;padding:12px 16px;background:#2d7ff9;color:white;font-weight:bold;font-size:15px}
button:active{transform:scale(.98)}
input[type=file]{display:none}
.upload{display:block;text-align:center;background:#2d7ff9;border-radius:10px;padding:14px;font-weight:bold;cursor:pointer}
video{width:100%;display:block;background:#000;border-radius:12px;max-height:520px}
.reel{width:min(100%,320px);aspect-ratio:9/16;margin:auto;background:#000;border-radius:14px;overflow:hidden}
.reel video{width:100%;height:100%;max-height:none;object-fit:contain}
.row{display:flex;gap:10px;align-items:center}
.row button{flex:1}
label{display:block;margin:12px 0 6px;font-size:14px;color:#b8c2d0}
input[type=range]{width:100%;accent-color:#2d7ff9}
.value{text-align:center;font-size:25px;font-weight:bold;margin:8px}
.ends{display:flex;justify-content:space-between;color:#aeb8c7;font-size:13px}
.balance{display:flex;justify-content:space-between;font-weight:bold;margin-top:10px}
.time{text-align:center;color:#b8c2d0;font-size:13px;margin-top:8px}
.status{text-align:center;color:#8fa1b8;font-size:13px;margin-top:10px}
.hidden{display:none}
.small{font-size:13px;color:#9eabbc}
</style>
</head>

<body>
<div class="app">

<h1>Live Synthist</h1>

<div class="card">
<h2>VIDEO</h2>

<label for="file" class="upload">UPLOAD VIDEO</label>
<input id="file" type="file" accept="video/*">

<div id="videoBox" class="hidden" style="margin-top:14px">
<video id="video" playsinline></video>

<div class="row" style="margin-top:10px">
<button id="play">▶ Play</button>
<button id="mute">🔊 Sound</button>
</div>

<input id="seek" type="range" min="0" max="100" value="0">
<div id="time" class="time">0:00 / 0:00</div>
</div>

<div id="videoStatus" class="status">No video selected</div>
</div>


<div class="card">
<h2>REAL / MEI</h2>

<div id="rmValue" class="value">50%</div>

<input id="rm" type="range" min="0" max="100" value="50">

<div class="ends">
<span>REAL 0%</span>
<span>MEI 100%</span>
</div>
</div>


<div class="card">
<h2>BALANCE</h2>

<input id="balance" type="range" min="0" max="100" value="50">

<div class="balance">
<span id="realValue">REAL: 50%</span>
<span id="meiValue">MEI: 50%</span>
</div>
</div>


<div class="card">
<h2>REEL 9:16</h2>

<div class="reel">
<video id="reelVideo" playsinline></video>
</div>

<div class="row" style="margin-top:12px">
<button id="fit">FIT</button>
<button id="crop">CROP</button>
</div>
</div>


<div class="card">
<h2>TRIM</h2>

<label>Start</label>
<input id="start" type="range" min="0" max="100" value="0">

<label>End</label>
<input id="end" type="range" min="0" max="100" value="100">

<div id="trimText" class="time">Start: 0:00 — End: 0:00</div>
</div>


<div class="card">
<h2>EXPORT</h2>

<button id="export" style="width:100%">EXPORT VIDEO</button>

<div id="exportStatus" class="status"></div>
</div>

</div>


<script>
const file=document.getElementById("file");
const video=document.getElementById("video");
const reelVideo=document.getElementById("reelVideo");
const videoBox=document.getElementById("videoBox");
const videoStatus=document.getElementById("videoStatus");
const play=document.getElementById("play");
const mute=document.getElementById("mute");
const seek=document.getElementById("seek");
const time=document.getElementById("time");
const rm=document.getElementById("rm");
const rmValue=document.getElementById("rmValue");
const balance=document.getElementById("balance");
const realValue=document.getElementById("realValue");
const meiValue=document.getElementById("meiValue");
const start=document.getElementById("start");
const end=document.getElementById("end");
const trimText=document.getElementById("trimText");
const exportBtn=document.getElementById("export");
const exportStatus=document.getElementById("exportStatus");
let url=null;

function fmt(s){
 if(!isFinite(s)) return "0:00";
 s=Math.max(0,Math.floor(s));
 let m=Math.floor(s/60);
 let sec=String(s%60).padStart(2,"0");
 return m+":"+sec;
}

file.addEventListener("change",()=>{
 const f=file.files[0];
 if(!f)return;

 if(url)URL.revokeObjectURL(url);
 url=URL.createObjectURL(f);

 video.src=url;
 reelVideo.src=url;
 videoBox.classList.remove("hidden");
 videoStatus.textContent=f.name;
});

play.addEventListener("click",()=>{
 if(!video.src)return;
 if(video.paused){
   video.play();
   play.textContent="⏸ Pause";
 }else{
   video.pause();
   play.textContent="▶ Play";
 }
});

mute.addEventListener("click",()=>{
 video.muted=!video.muted;
 mute.textContent=video.muted?"🔇 Muted":"🔊 Sound";
});

video.addEventListener("loadedmetadata",()=>{
 seek.max=video.duration;
 start.max=video.duration;
 end.max=video.duration;
 end.value=video.duration;
 updateTrim();
 time.textContent="0:00 / "+fmt(video.duration);
});

video.addEventListener("timeupdate",()=>{
 seek.value=video.currentTime;
 time.textContent=fmt(video.currentTime)+" / "+fmt(video.duration);
});

seek.addEventListener("input",()=>{
 video.currentTime=Number(seek.value);
});

rm.addEventListener("input",()=>{
 const v=Number(rm.value);
 rmValue.textContent=v+"%";
});

balance.addEventListener("input",()=>{
 const v=Number(balance.value);
 realValue.textContent="REAL: "+v+"%";
 meiValue.textContent="MEI: "+(100-v)+"%";
});

function updateTrim(){
 let s=Number(start.value);
 let e=Number(end.value);

 if(s>e){
   if(document.activeElement===start) end.value=s;
   else start.value=e;
   s=Number(start.value);
   e=Number(end.value);
 }

 trimText.textContent="Start: "+fmt(s)+" — End: "+fmt(e);
}

start.addEventListener("input",updateTrim);
end.addEventListener("input",updateTrim);

document.getElementById("fit").addEventListener("click",()=>{
 reelVideo.style.objectFit="contain";
});

document.getElementById("crop").addEventListener("click",()=>{
 reelVideo.style.objectFit="cover";
});

exportBtn.addEventListener("click",()=>{
 exportStatus.textContent=
 "Video export is not supported by this browser yet. Your original video remains unchanged.";
});

video.addEventListener("error",()=>{
 videoStatus.textContent="Unable to play this video in the browser.";
});
</script>

</body>
  </html>
