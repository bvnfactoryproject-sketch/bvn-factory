<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Synthist</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
}

header {
  padding: 20px 15px 10px;
}

h1 {
  margin: 0;
  font-size: 32px;
}

.subtitle {
  margin-top: 6px;
  color: #aaa;
}

.panel {
  width: min(700px, 94%);
  margin: 15px auto;
  padding: 20px;
  background: #1d1d1d;
  border-radius: 18px;
}

.controls {
  display: grid;
  gap: 18px;
}

.control {
  text-align: left;
}

label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-weight: bold;
}

input[type="range"] {
  width: 100%;
  height: 35px;
}

select,
button {
  font-size: 17px;
  padding: 12px 18px;
  border-radius: 10px;
  border: 1px solid #555;
}

select {
  width: 100%;
  background: #222;
  color: white;
}

button {
  cursor: pointer;
  background: #eee;
  color: #111;
  margin: 5px;
}

#play {
  background: #35c759;
  color: white;
  border: none;
}

#stop {
  background: #ff453a;
  color: white;
  border: none;
}

canvas {
  width: 100%;
  height: 180px;
  background: #050505;
  border-radius: 12px;
  display: block;
}

.keyboard {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin-top: 15px;
  overflow-x: auto;
  padding-bottom: 5px;
}

.key {
  min-width: 48px;
  height: 150px;
  background: white;
  color: black;
  border-radius: 0 0 8px 8px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 12px;
  font-weight: bold;
  user-select: none;
  touch-action: none;
}

.key.active {
  transform: translateY(5px);
  background: #aaa;
}

.status {
  margin-top: 15px;
  color: #aaa;
  min-height: 24px;
}

footer {
  color: #777;
  padding: 20px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>🎛️ Live Synthist</h1>
  <div class="subtitle">Real-time Web Audio Synthesizer</div>
</header>

<div class="panel">

  <div>
    <button id="play">▶ Play</button>
    <button id="stop">■ Stop</button>
  </div>

  <div class="controls">

    <div class="control">
      <label>
        <span>Frequency</span>
        <span id="freqValue">440 Hz</span>
      </label>
      <input
        id="frequency"
        type="range"
        min="50"
        max="1200"
        value="440"
      >
    </div>

    <div class="control">
      <label>
        <span>Volume</span>
        <span id="volumeValue">30%</span>
      </label>
      <input
        id="volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.30"
      >
    </div>

    <div class="control">
      <label>
        <span>Waveform</span>
      </label>

      <select id="waveform">
        <option value="sine">Sine</option>
        <option value="square">Square</option>
        <option value="sawtooth">Sawtooth</option>
        <option value="triangle">Triangle</option>
      </select>
    </div>

  </div>
</div>

<div class="panel">
  <h2>📊 Live Waveform</h2>
  <canvas id="visualizer"></canvas>
</div>

<div class="panel">
  <h2>🎹 Touch Keyboard</h2>

  <div class="keyboard">

    <div class="key" data-note="261.63">C</div>
    <div class="key" data-note="293.66">D</div>
    <div class="key" data-note="329.63">E</div>
    <div class="key" data-note="349.23">F</div>
    <div class="key" data-note="392.00">G</div>
    <div class="key" data-note="440.00">A</div>
    <div class="key" data-note="493.88">B</div>
    <div class="key" data-note="523.25">C</div>

  </div>
</div>

<div class="panel">
  <div class="status" id="status">
    Ready — press Play or touch a key.
  </div>
</div>

<footer>
  BVN Factory • Live Synthist
</footer>

<script>
let audioContext = null;
let oscillator = null;
let gainNode = null;
let analyser = null;

const playButton = document.getElementById("play");
const stopButton = document.getElementById("stop");

const frequency = document.getElementById("frequency");
const volume = document.getElementById("volume");
const waveform = document.getElementById("waveform");

const freqValue = document.getElementById("freqValue");
const volumeValue = document.getElementById("volumeValue");
const status = document.getElementById("status");

const canvas = document.getElementById("visualizer");
const canvasContext = canvas.getContext("2d");

let playing = false;

function createAudio() {

  if (!audioContext) {
    audioContext = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

    gainNode = audioContext.createGain();

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 2048;

    gainNode.connect(analyser);
    analyser.connect(audioContext.destination);
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }
}

function startSynth(freq = Number(frequency.value)) {

  createAudio();

  if (oscillator) {
    try {
      oscillator.stop();
    } catch (e) {}
  }

  oscillator = audioContext.createOscillator();

  oscillator.type = waveform.value;
  oscillator.frequency.setValueAtTime(
    freq,
    audioContext.currentTime
  );

  gainNode.gain.setValueAtTime(
    Number(volume.value),
    audioContext.currentTime
  );

  oscillator.connect(gainNode);
  oscillator.start();

  playing = true;

  status.textContent =
    "Playing • " + Math.round(freq) + " Hz";
}

function stopSynth() {

  if (oscillator) {

    try {
      oscillator.stop();
    } catch (e) {}

    oscillator.disconnect();
    oscillator = null;
  }

  playing = false;

  status.textContent = "Stopped";
}

playButton.addEventListener("click", () => {
  startSynth();
});

stopButton.addEventListener("click", () => {
  stopSynth();
});

frequency.addEventListener("input", () => {

  const value = Number(frequency.value);

  freqValue.textContent =
    Math.round(value) + " Hz";

  if (oscillator && playing) {
    oscillator.frequency.setValueAtTime(
      value,
      audioContext.currentTime
    );
  }
});

volume.addEventListener("input", () => {

  const value = Number(volume.value);

  volumeValue.textContent =
    Math.round(value * 100) + "%";

  if (gainNode && audioContext) {
    gainNode.gain.setValueAtTime(
      value,
      audioContext.currentTime
    );
  }
});

waveform.addEventListener("change", () => {

  if (oscillator) {
    oscillator.type = waveform.value;
  }
});


// Touch keyboard

document.querySelectorAll(".key").forEach(key => {

  const playKey = (event) => {

    event.preventDefault();

    key.classList.add("active");

    const note =
      Number(key.dataset.note);

    frequency.value = note;

    freqValue.textContent =
      note.toFixed(2) + " Hz";

    startSynth(note);
  };

  const releaseKey = (event) => {

    event.preventDefault();

    key.classList.remove("active");

    stopSynth();
  };

  key.addEventListener(
    "pointerdown",
    playKey
  );

  key.addEventListener(
    "pointerup",
    releaseKey
  );

  key.addEventListener(
    "pointercancel",
    releaseKey
  );

  key.addEventListener(
    "pointerleave",
    releaseKey
  );
});


// Waveform visualizer

function drawVisualizer() {

  requestAnimationFrame(drawVisualizer);

  if (!analyser) {

    canvasContext.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    return;
  }

  const bufferLength =
    analyser.fftSize;

  const dataArray =
    new Uint8Array(bufferLength);

  analyser.getByteTimeDomainData(
    dataArray
  );

  canvasContext.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  canvasContext.beginPath();

  const sliceWidth =
    canvas.width / bufferLength;

  let x = 0;

  for (
    let i = 0;
    i < bufferLength;
    i++
  ) {

    const value =
      dataArray[i] / 128.0;

    const y =
      value * canvas.height / 2;

    if (i === 0) {
      canvasContext.moveTo(x, y);
    } else {
      canvasContext.lineTo(x, y);
    }

    x += sliceWidth;
  }

  canvasContext.lineTo(
    canvas.width,
    canvas.height / 2
  );

  canvasContext.stroke();

}

drawVisualizer();


// Keyboard shortcuts

const keyboardNotes = {
  "a": 261.63,
  "s": 293.66,
  "d": 329.63,
  "f": 349.23,
  "g": 392.00,
  "h": 440.00,
  "j": 493.88,
  "k": 523.25
};

document.addEventListener("keydown", event => {

  if (event.repeat) return;

  const note =
    keyboardNotes[event.key.toLowerCase()];

  if (note) {
    startSynth(note);
  }

});

document.addEventListener("keyup", event => {

  if (keyboardNotes[event.key.toLowerCase()]) {
    stopSynth();
  }

});
</script>

</body>
</html>
